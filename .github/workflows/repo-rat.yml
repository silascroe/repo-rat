name: Repo Rat

on:
  # Automatic polling is paused; run manually with workflow_dispatch.
  workflow_dispatch:
    inputs:
      backfill:
        description: "Report releases seeded by an earlier normal run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: repo-rat
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Repo Rat
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Repo Rat
        run: python -m pip install .

      - name: Poll configured repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO_RAT_STARRED_USERNAME: ${{ vars.REPO_RAT_STARRED_USERNAME }}
        run: |
          python - "$RUNNER_TEMP/repo-rat.json" <<'PY'
          import json
          import os
          import sys

          with open("config.json", encoding="utf-8") as source:
              config = json.load(source)

          starred_username = os.environ.get("REPO_RAT_STARRED_USERNAME", "").strip()
          if starred_username:
              config["starred_username"] = starred_username

          with open(sys.argv[1], "w", encoding="utf-8") as destination:
              json.dump(config, destination, indent=2)
              destination.write("\n")
          PY

          if [[ "${{ inputs.backfill }}" == "true" ]]; then
            python -m repo_rat --config "$RUNNER_TEMP/repo-rat.json" --backfill
          else
            python -m repo_rat --config "$RUNNER_TEMP/repo-rat.json" --once
          fi

      - name: Persist state database
        if: ${{ success() }}
        run: |
          if [[ ! -f state.db ]]; then
            echo "No state database was created."
            exit 0
          fi

          git config user.name "repo-rat[bot]"
          git config user.email "repo-rat[bot]@users.noreply.github.com"
          git add -f state.db

          if git diff --cached --quiet -- state.db; then
            echo "State database is unchanged."
            exit 0
          fi

          git commit -m "chore: update repo rat state"
          git push
